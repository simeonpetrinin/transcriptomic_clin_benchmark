name: LAML example

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Run the LAML example
        run: Rscript scripts/run_example.R
