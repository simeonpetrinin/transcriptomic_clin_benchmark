name: Example runs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  example:
    name: example (${{ matrix.cancer }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cancer: [LAML, GBM]
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Run the ${{ matrix.cancer }} example
        run: Rscript scripts/run_example.R ${{ matrix.cancer }}
